<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Replicode</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div class="popup__brand">
          <img class="popup__logo" src="icons/logo.svg" alt="" />
          <div class="popup__brand-text">
            <p class="popup__eyebrow">Replicode</p>
            <h1 id="popupTitle" class="popup__title">Capture UI with context</h1>
          </div>
        </div>
        <span id="statusBadge" class="status-badge status-badge--idle">Idle</span>
      </header>

      <p id="captureMeta" class="popup__meta" role="status" aria-live="polite">
        Open any page, then capture the component you want to export.
      </p>

      <button id="startCapture" class="button button--primary" type="button">
        <span class="button__label">Start capture</span>
        <kbd class="button__kbd">⌘⇧X</kbd>
      </button>

      <div class="popup__secondary">
        <button id="openReview" class="button" type="button">Review panel</button>
        <button id="stopCapture" class="button button--ghost" type="button" disabled>Stop</button>
      </div>
      <p class="popup__hint">Use the floating bar on the page to copy the Figma payload after capturing.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
