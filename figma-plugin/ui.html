<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Replicode</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "SF Pro Text", system-ui, sans-serif;
        --brand: #ef4cd4;
        --brand-hover: #d932bb;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--figma-color-bg, #ffffff);
        color: var(--figma-color-text, #111827);
        overflow: hidden;
      }

      .app {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px 16px;
        height: 100%;
        min-height: 0;
      }

      .instructions {
        margin: 0;
        font-size: 12px;
        line-height: 1.55;
        color: var(--figma-color-text-secondary, #6b7280);
      }

      .instructions a {
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }

      .instructions a:hover {
        text-decoration: underline;
      }

      textarea {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        resize: none;
        border: 1px solid var(--figma-color-border, #dbe1ea);
        border-radius: 10px;
        background: var(--figma-color-bg-secondary, #f8fafc);
        color: inherit;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 12px;
      }

      textarea:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(239, 76, 212, 0.18);
      }

      .actions {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
      }

      button {
        border: 1px solid var(--figma-color-border, #dbe1ea);
        border-radius: 10px;
        background: var(--figma-color-bg-secondary, #ffffff);
        color: inherit;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 12px;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease, filter 120ms ease;
      }

      button:hover {
        background: var(--figma-color-bg-hover, #f3f4f6);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.primary {
        background: linear-gradient(135deg, var(--brand), #ff9472);
        border-color: transparent;
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(239, 76, 212, 0.22);
      }

      button.primary:hover:not(:disabled) {
        filter: brightness(1.06);
      }

      .status {
        margin: 0;
        min-height: 16px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--figma-color-text-secondary, #6b7280);
      }

      .status[data-tone="error"] {
        color: #c2410c;
      }

      .status[data-tone="success"] {
        color: #15803d;
      }

      .status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <p class="instructions">
        First extract details using the
        <a id="extensionLink" href="https://chromewebstore.google.com/detail/fmababdbpbjjmldejdliocbgmdlggfjf?utm_source=item-share-cb" target="_blank" rel="noopener noreferrer">Replicode Chrome extension</a>,
        then paste the payload below.
      </p>

      <textarea id="payload" spellcheck="false" placeholder="Paste payload here…"></textarea>

      <div class="actions">
        <button id="clearBtn" type="button">Clear</button>
        <button id="pasteBtn" class="primary" type="button">Paste</button>
      </div>

      <p id="status" class="status"></p>
    </main>

    <script>
      const payloadField = document.getElementById("payload")
      const statusEl = document.getElementById("status")
      const clearBtn = document.getElementById("clearBtn")
      const pasteBtn = document.getElementById("pasteBtn")
      const extensionLink = document.getElementById("extensionLink")

      function setStatus(text, tone) {
        statusEl.textContent = text || ""
        if (tone) {
          statusEl.dataset.tone = tone
        } else {
          delete statusEl.dataset.tone
        }
      }

      // Open the Chrome Web Store link in the user's default browser.
      // Figma plugins run in an iframe; window.open works for external URLs.
      extensionLink.addEventListener("click", (event) => {
        event.preventDefault()
        window.open(extensionLink.href, "_blank", "noopener,noreferrer")
      })

      clearBtn.addEventListener("click", () => {
        payloadField.value = ""
        payloadField.focus()
        setStatus("")
      })

      pasteBtn.addEventListener("click", async () => {
        let payload = payloadField.value.trim()

        // Empty field? Try the clipboard.
        if (!payload) {
          try {
            const fromClipboard = await navigator.clipboard.readText()
            payloadField.value = fromClipboard
            payload = fromClipboard.trim()
          } catch (error) {
            setStatus("Couldn't read clipboard. Paste manually with ⌘V or Ctrl+V.", "error")
            return
          }
        }

        if (!payload) {
          setStatus("Paste a Replicode payload first.", "error")
          return
        }

        if (payload.startsWith("<!-- component.html -->") || payload.includes("/* styles.css */")) {
          setStatus('That looks like an HTML/CSS export. Use "Copy Figma payload" from the extension.', "error")
          return
        }

        setStatus("Importing…")
        pasteBtn.disabled = true
        parent.postMessage(
          {
            pluginMessage: {
              type: "IMPORT_CAPTURE",
              payload,
              options: { mode: "hybrid" }
            }
          },
          "*"
        )
      })

      window.onmessage = (event) => {
        const message = event.data && event.data.pluginMessage
        if (!message || message.type !== "IMPORT_RESULT") {
          return
        }
        pasteBtn.disabled = false
        setStatus(
          message.ok ? `Imported ${message.detail}` : `Import failed: ${message.detail}`,
          message.ok ? "success" : "error"
        )
      }
    </script>
  </body>
</html>
